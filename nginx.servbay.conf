# Nginx equivalent of .htaccess, included from the ServBay site's server block.
# Nginx ignores .htaccess, so keep this in sync when rewrite rules change.

charset utf-8;

location ^~ /data/ { deny all; }
location ^~ /database/ { deny all; }
location ^~ /lib/ { deny all; }
location ^~ /templates/ { deny all; }
location ^~ /tests/ { deny all; }
location ^~ /docs/ { deny all; }
location ^~ /.git/ { deny all; }
location ~ /\.(?!well-known/) { deny all; }
location ~ \.(md|conf)$ { deny all; }
location ~ ^/config\.(local|example)\.php$ { deny all; }
location ~ ^/media/.*\.(php|phtml|phar|pl|py|cgi|sh)$ { deny all; }

if ($host ~* "^www\.(.+)$") { return 301 https://$1$request_uri; }

# Fixed SEO redirects (other redirects are managed in Admin → Website → Redirects)
rewrite ^/(home|index)/?$ / permanent;
rewrite ^/contact-us/?$ /contact permanent;
rewrite ^/our-services/?$ /services permanent;
rewrite ^/about-us/?$ /about permanent;

# $request_uri is the original request, so internal rewrites to *.php below don't loop.
if ($request_uri ~* "^/index\.php(\?|$)") { return 301 /; }
if ($request_uri ~* "^/admin/index\.php(\?|$)") { return 301 /admin/; }
if ($request_uri ~* "^/([^.?]+)\.php(\?.*)?$") { return 301 /$1$2; }

rewrite ^/form/([a-zA-Z0-9_-]+)/?$ /form.php?slug=$1 last;
rewrite ^/sitemap\.xml$ /sitemap.php last;
rewrite ^/sitemap-([a-z]+)\.xml$ /sitemap.php?part=$1 last;
rewrite ^/robots\.txt$ /robots.php last;
rewrite ^/email-asset/([A-Za-z0-9._-]+)$ /email-asset.php?f=$1 last;
rewrite "^/email-open/([a-fA-F0-9]{32})(?:\.gif)?$" /email-open.php?t=$1 last;
rewrite ^/admin/?$ /admin/index.php last;
rewrite ^/api/([a-zA-Z0-9_-]+)/?$ /api/$1.php last;

error_page 404 = /cms.php;

location / {
    try_files $uri $uri/ @extensionless;
}

location @extensionless {
    if (-f $request_filename.php) {
        rewrite ^(.*)$ $1.php last;
    }
    rewrite ^ /cms.php last;
}
